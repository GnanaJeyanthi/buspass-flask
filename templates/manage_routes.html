{% extends 'base.html' %}
{% block content %}
<h2>Manage Routes</h2>

<form method="POST">
    <input type="text" name="route_no" placeholder="Route No" required>
    <input type="text" name="start_point" placeholder="Start Point" required>
    <input type="text" name="end_point" placeholder="End Point" required>
    <input type="number" name="capacity" placeholder="Capacity" required>
    <button type="submit">Add Route</button>
</form>

<h3>Existing Routes</h3>
<table border="1" align="center">
    <tr>
        <th>ID</th>
        <th>Route No</th>
        <th>Start</th>
        <th>End</th>
        <th>Capacity</th>
        <th>Actions</th>
    </tr>
    {% for r in routes %}
    <tr>
        <td>{{ r.id }}</td>
        <td>{{ r.route_no }}</td>
        <td>{{ r.start_point }}</td>
        <td>{{ r.end_point }}</td>
        <td>{{ r.capacity }}</td>
        <td>
            <a href="{{ url_for('update_route', id=r.id) }}">Edit</a> |
            <a href="{{ url_for('delete_route', id=r.id) }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
